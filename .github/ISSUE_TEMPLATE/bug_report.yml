name: Bug report
description: Report reproducible behavior that is not working as expected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include private manuscripts, Scrivener projects, API keys, or other sensitive material.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the unexpected behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Scribe version or commit
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - iPadOS
        - visionOS
        - Other
  - type: textarea
    id: context
    attributes:
      label: Additional context
