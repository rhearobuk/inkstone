name: Swift tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Swift package tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Run tests
        run: swift test

  app-build:
    name: App build (${{ matrix.platform }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, iOS Simulator, visionOS Simulator]
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Build app without signing
        env:
          DESTINATION: generic/platform=${{ matrix.platform }}
        run: |
          xcodebuild -quiet -project AuthorApp.xcodeproj -scheme Inkstone \
            -destination "$DESTINATION" -derivedDataPath "$RUNNER_TEMP/InkstoneBuild" \
            CODE_SIGNING_ALLOWED=NO build
